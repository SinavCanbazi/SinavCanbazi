    <script src="script.js"></script>
    <script>
        // Form Gönderim İşlemi
        const form = document.getElementById('my-form');
        const statusBox = document.getElementById('form-status');

        if (form) {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                statusBox.className = 'status-box sending show';
                statusBox.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mesajınız iletiliyor...';

                fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form),
                    headers: { 'Accept': 'application/json' }
                }).then(response => {
                    if (response.ok) {
                        statusBox.className = 'status-box success show';
                        statusBox.innerHTML = '<i class="fa-solid fa-circle-check"></i> Mesajınız başarıyla gönderildi!';
                        form.reset();
                        setTimeout(() => { statusBox.classList.remove('show'); }, 5000);
                    } else {
                        throw new Error();
                    }
                }).catch(() => {
                    statusBox.className = 'status-box error show';
                    statusBox.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Bir hata oluştu, lütfen tekrar deneyin.';
                });
            });
        }

        // Preloader Fonksiyonu
        function hidePreloader() {
            const loader = document.querySelector('.loader-wrapper');
            if (loader && !loader.classList.contains('fade-out')) {
                loader.classList.add('fade-out');
            }
        }
        window.addEventListener('load', hidePreloader);
        setTimeout(hidePreloader, 1500);

        // Tema Değiştirici
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggleBtn = document.getElementById('theme-toggle');
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
            }
            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', () => {
                    document.body.classList.toggle('dark-mode');
                    localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
                });
            }
        });
    </script>
