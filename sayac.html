<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sınav Canbazı - Süre Tut</title>
    <link rel="icon" type="image/png" href="fav.png">
    <style>
        :root {
            --bg-color: #0d0a18;
            --panel-bg: #141026;
            --border-color: rgba(168, 85, 247, 0.2);
            --text-color: #ffffff;
            --subtext-color: #a78bfa;
            --accent-color: #a855f7;
            --accent-hover: #9333ea;
            --active-card-bg: rgba(168, 85, 247, 0.12);
            --card-bg: #22252d;
            --card-text: #f8fafc;
        }

        body.light-mode {
            --bg-color: #f5f3ff;
            --panel-bg: #ffffff;
            --border-color: #ddd6fe;
            --text-color: #1e1b4b;
            --subtext-color: #6d28d9;
            --active-card-bg: rgba(168, 85, 247, 0.08);
            --card-bg: #e2e8f0;
            --card-text: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-color); color: var(--text-color); min-height: 100vh; padding: 24px 4%; transition: 0.3s; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .back-btn { color: var(--text-color); text-decoration: none; font-weight: 600; font-size: 14px; background: var(--panel-bg); padding: 10px 18px; border-radius: 12px; border: 1px solid var(--border-color); display: inline-flex; align-items: center; gap: 8px; }

        .main-container { display: grid; grid-template-columns: 340px 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
        @media (max-width: 900px) { .main-container { grid-template-columns: 1fr; } }

        .panel { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 24px; }

        /* Sol Ayarlar */
        .panel-header { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .panel-sub { font-size: 13px; color: var(--subtext-color); margin-bottom: 20px; }

        .mode-switcher { display: flex; background: rgba(0, 0, 0, 0.25); padding: 4px; border-radius: 14px; margin-bottom: 24px; gap: 4px; border: 1px solid var(--border-color); }
        .mode-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--subtext-color); font-weight: 600; font-size: 13px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .mode-btn.active { background: var(--accent-color); color: #fff; }

        .section-title { font-size: 12px; font-weight: 700; color: var(--subtext-color); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }

        .preset-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
        .preset-card { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px 16px; cursor: pointer; transition: 0.2s; }
        .preset-card:hover { border-color: var(--accent-color); }
        .preset-card.active { border-color: var(--accent-color); background: var(--active-card-bg); }
        .preset-val { font-size: 15px; font-weight: 700; color: var(--accent-color); }
        .preset-lbl { font-size: 12px; color: var(--subtext-color); margin-top: 2px; }

        .custom-input-box { display: none; margin-top: 10px; }
        .custom-input-box input { width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 10px; color: #fff; outline: none; }

        .info-note { font-size: 12px; color: var(--accent-color); font-weight: 600; margin-top: 12px; }

        /* Sağ Sayaç */
        .timer-panel { display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 520px; }
        .timer-top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        
        .theme-toggle { display: flex; background: rgba(0,0,0,0.2); padding: 4px; border-radius: 20px; border: 1px solid var(--border-color); }
        .theme-btn { padding: 6px 14px; border: none; background: transparent; color: var(--subtext-color); font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 16px; }
        .theme-btn.active { background: rgba(255,255,255,0.1); color: #fff; }

        /* FLIP CLOCK TASARIMI */
        .flip-clock-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 50px 0;
            perspective: 1000px;
        }
        .flip-group { display: flex; gap: 6px; }
        .flip-card {
            width: 70px;
            height: 120px;
            background: var(--card-bg);
            color: var(--card-text);
            border-radius: 12px;
            font-size: 72px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.08);
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

    

        /* 3D Katlanma Animasyonu */
        @keyframes flipFold {
            0% {
                transform: rotateX(0deg);
                box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            }
            50% {
                transform: rotateX(-90deg);
                box-shadow: 0 2px 5px rgba(0,0,0,0.2);
                filter: brightness(0.8);
            }
            100% {
                transform: rotateX(0deg);
                box-shadow: 0 10px 20px rgba(0,0,0,0.4);
                filter: brightness(1);
            }
        }

        .flip-card.animate {
            animation: flipFold 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .flip-colon {
            font-size: 36px;
            font-weight: 800;
            color: var(--subtext-color);
            margin: 0 4px;
        }

        .timer-status { font-size: 13px; color: var(--subtext-color); margin-bottom: 24px; font-weight: 500; }

        /* Alt Butonlar */
        .control-btns { display: flex; gap: 14px; width: 100%; max-width: 440px; }
        .btn-ctrl { flex: 1; padding: 14px; border: none; border-radius: 14px; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-start { background: var(--accent-color); color: #ffffff; }
        .btn-start:hover { background: var(--accent-hover); }
        .btn-reset { background: rgba(255, 255, 255, 0.06); color: var(--text-color); border: 1px solid var(--border-color); }
        .btn-reset:hover { background: rgba(255, 255, 255, 0.1); }

        .brand-footer { margin-top: 20px; font-size: 14px; font-weight: 800; color: var(--accent-color); letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="back-btn">← Ana Sayfaya Dön</a>
    </div>

    <div class="main-container">
        <!-- Sol Panel: Ayarlar -->
        <div class="panel">
            <div class="panel-header">Ayarlar</div>
            <div class="panel-sub">Mod ve süre şablonu</div>

            <div class="mode-switcher">
                <button class="mode-btn active" id="btnModeCountdown" onclick="setMode('countdown')">⏳ Geri sayım</button>
                <button class="mode-btn" id="btnModeStopwatch" onclick="setMode('stopwatch')">⏱️ Kronometre</button>
            </div>

            <div class="section-title">Süre Şablonu</div>
            <div class="preset-list" id="presetList">
                <div class="preset-card active" onclick="selectPreset(165, this)">
                    <div class="preset-val">165 dk</div>
                    <div class="preset-lbl">TYT genel deneme</div>
                </div>
                <div class="preset-card" onclick="selectPreset(180, this)">
                    <div class="preset-val">180 dk</div>
                    <div class="preset-lbl">AYT genel deneme</div>
                </div>
                <div class="preset-card" onclick="selectPreset('custom', this)">
                    <div class="preset-val">Özel</div>
                    <div class="preset-lbl">Kendi sürenizi girin</div>
                </div>
            </div>

            <div class="custom-input-box" id="customInputBox">
                <input type="number" id="customMinutes" placeholder="Dakika giriniz (örn: 45)" oninput="applyCustomTime()">
            </div>

            <div class="info-note" id="infoNote">Standart TYT süresi: 2 saat 45 dakika</div>
        </div>

        <!-- Sağ Panel: Sayaç Ekranı -->
        <div class="panel timer-panel">
            <div class="timer-top">
                <div>
                    <div class="panel-header">Sayaç</div>
                    <div class="panel-sub">Sayaç ve kontroller</div>
                </div>
                <div class="theme-toggle">
                    <button class="theme-btn" onclick="setTheme('light')">☀️ Açık</button>
                    <button class="theme-btn active" onclick="setTheme('dark')">🌙 Koyu</button>
                </div>
            </div>

            <!-- FLIP CLOCK EKRANI -->
            <div class="flip-clock-wrap">
                <div class="flip-group">
                    <div class="flip-card" id="h1">0</div>
                    <div class="flip-card" id="h2">2</div>
                </div>
                <div class="flip-colon">:</div>
                <div class="flip-group">
                    <div class="flip-card" id="m1">4</div>
                    <div class="flip-card" id="m2">5</div>
                </div>
                <div class="flip-colon">:</div>
                <div class="flip-group">
                    <div class="flip-card" id="s1">0</div>
                    <div class="flip-card" id="s2">0</div>
                </div>
            </div>

            <div class="timer-status" id="timerStatus">Hazır — başlat</div>

            <div class="control-btns">
                <button class="btn-ctrl btn-start" id="startBtn" onclick="toggleTimer()">▶ Başlat</button>
                <button class="btn-ctrl btn-reset" onclick="resetTimer()">❚❚ Durdur / Sıfırla</button>
            </div>

            <div class="brand-footer">SINAV CANBAZI</div>
        </div>
    </div>

    <script>
        let mode = 'countdown';
        let totalSeconds = 165 * 60;
        let initialSeconds = 165 * 60;
        let timerInterval = null;
        let isRunning = false;

        function updateCard(id, newValue) {
            const card = document.getElementById(id);
            if (card && card.innerText !== newValue) {
                card.innerText = newValue;
                card.classList.remove('animate');
                void card.offsetWidth; // Animasyonu yeniden tetikler
                card.classList.add('animate');
            }
        }

        function updateDisplay() {
            let hrs = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            let mins = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            let secs = (totalSeconds % 60).toString().padStart(2, '0');

            updateCard('h1', hrs[0]);
            updateCard('h2', hrs[1]);
            updateCard('m1', mins[0]);
            updateCard('m2', mins[1]);
            updateCard('s1', secs[0]);
            updateCard('s2', secs[1]);
        }

        function setMode(newMode) {
            mode = newMode;
            document.getElementById('btnModeCountdown').classList.toggle('active', mode === 'countdown');
            document.getElementById('btnModeStopwatch').classList.toggle('active', mode === 'stopwatch');
            
            document.getElementById('presetList').style.display = mode === 'countdown' ? 'flex' : 'none';
            document.getElementById('infoNote').style.display = mode === 'countdown' ? 'block' : 'none';
            document.getElementById('customInputBox').style.display = 'none';

            resetTimer();
            if (mode === 'stopwatch') {
                totalSeconds = 0;
                document.getElementById('timerStatus').innerText = "Kronometre Hazır";
            }
            updateDisplay();
        }

        function selectPreset(val, el) {
            document.querySelectorAll('.preset-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');

            const customBox = document.getElementById('customInputBox');
            const infoNote = document.getElementById('infoNote');

            if (val === 'custom') {
                customBox.style.display = 'block';
                infoNote.innerText = "Kendi sürenizi yukarıya dakika olarak girin.";
            } else {
                customBox.style.display = 'none';
                initialSeconds = val * 60;
                infoNote.innerText = val === 165 ? "Standart TYT süresi: 2 saat 45 dakika" : "Standart AYT süresi: 3 saat 00 dakika";
                resetTimer();
            }
        }

        function applyCustomTime() {
            let mins = parseInt(document.getElementById('customMinutes').value) || 0;
            initialSeconds = mins * 60;
            resetTimer();
        }

        function toggleTimer() {
            const startBtn = document.getElementById('startBtn');
            const statusText = document.getElementById('timerStatus');

            if (isRunning) {
                clearInterval(timerInterval);
                startBtn.innerText = '▶ Devam Et';
                statusText.innerText = 'Duraklatıldı';
                isRunning = false;
            } else {
                isRunning = true;
                startBtn.innerText = '❚❚ Durdur';
                statusText.innerText = 'Devam ediyor...';

                timerInterval = setInterval(() => {
                    if (mode === 'countdown') {
                        if (totalSeconds > 0) {
                            totalSeconds--;
                        } else {
                            clearInterval(timerInterval);
                            statusText.innerText = 'Süre Doldu!';
                            alert('Süre doldu!');
                        }
                    } else {
                        totalSeconds++;
                    }
                    updateDisplay();
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            document.getElementById('startBtn').innerText = '▶ Başlat';
            document.getElementById('timerStatus').innerText = 'Hazır — başlat';
            totalSeconds = mode === 'countdown' ? initialSeconds : 0;
            updateDisplay();
        }

        function setTheme(theme) {
            if (theme === 'light') document.body.classList.add('light-mode');
            else document.body.classList.remove('light-mode');

            const btns = document.querySelectorAll('.theme-btn');
            btns[0].classList.toggle('active', theme === 'light');
            btns[1].classList.toggle('active', theme === 'dark');
        }

        updateDisplay();
    </script>
</body>
</html>
